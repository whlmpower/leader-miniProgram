# 全向领导力专属顾问 — 文字锚点（替代打分）
# 每个维度 4 级，互斥且连续，用户选最贴近的描述，后台映射理论等级
# 禁止让用户打分，只用情境化文字选项
# 多选规则：若用户自述"多项都符合"，取最高等级为锚点值，并在报告中注明覆盖区间（如 C~D）。

anchors:
  # ===== 向下管理 =====
  down_competence:
    label: "下属能力水平"
    direction: down
    levels:
      A: "新手期：刚接触，经常需要手把手教，独立做容易出错"
      B: "成长期：能完成常规任务，但复杂或异常情况会卡壳"
      C: "熟练期：独立能干好常规任务，很少需要指导，但还难教别人"
      D: "专家期：比多数同事都懂，能指导他人、独立攻坚"

  down_commitment:
    label: "下属意愿状态"
    direction: down
    levels:
      A: "抵触期：明显不想干，抱怨或消极对抗"
      B: "被动期：安排才动，不推就不动，缺乏主动性"
      C: "配合期：态度端正愿意配合，但缺方向和内驱力"
      D: "主动期：有自己的目标，主动找事做、提建议"

  down_task:
    label: "你对把事做成的关注"
    direction: down
    levels:
      A: "放养型：很少过问进度，结果好坏随缘"
      B: "结果型：紧盯目标和 deadline，不管过程怎么实现"
      C: "过程型：不仅看结果，还定流程、盯节点、纠偏差"
      D: "体系型：既抓结果也建机制，让团队能自我运转"

  down_relation:
    label: "你对人的关注"
    direction: down
    levels:
      A: "疏离型：公事公办，很少聊工作外的事"
      B: "客气型：表面和谐，但有距离，不深聊"
      C: "关怀型：主动关心个人困难和成长"
      D: "赋能型：深度信任，授权加支持，把人当伙伴"

  grow_reality:
    label: "现状清晰度（被辅导者）"
    direction: down
    levels:
      A: "没概念：只觉得不对劲，说不清问题在哪"
      B: "大概知道：能描述现象，但没数据、没归因"
      C: "比较清楚：有具体事例，能说清卡在哪"
      D: "数据充分：有数据有对比，能定位根因"

  grow_goal:
    label: "目标清晰度（被辅导者）"
    direction: down
    levels:
      A: "没想过：走一步看一步"
      B: "模糊愿望：希望团队好点这类泛泛期待"
      C: "有方向：知道要达成什么，但不具体"
      D: "明确可衡量：SMART 级别的目标"

  # ===== 向上汇报 =====
  up_expectation:
    label: "领导对你的预期清晰度"
    direction: up
    levels:
      A: "完全不清晰：不知道领导到底要什么"
      B: "大致知道：知道方向，但标准模糊"
      C: "明确KPI：有清晰指标和交付标准"
      D: "懂战略意图：连为什么做、长远目标都清楚"

  up_proactivity:
    label: "你的汇报主动性"
    direction: up
    levels:
      A: "只在被催才报：出了事才说"
      B: "定期报进度：按节奏同步，但不主动暴露风险"
      C: "主动报风险：提前同步卡点和风险"
      D: "带方案请示：提问题同时给选项和推荐"

  # ===== 领导侧（用户估计，非自评；仅二次信号命中时惰性追问，不进 required_anchors）=====
  up_leader_control:
    label: "领导控制风格（你的估计）"
    direction: up
    estimated: true
    levels:
      A: "放手型：只问结果，不干预过程"
      B: "关注节点：关键里程碑才介入"
      C: "过程管控：要按既定流程走，常过问细节"
      D: "微管理：大小事都要经手、亲自把关"

  up_deviation_tolerance:
    label: "领导对自主偏差的容忍度（你的估计）"
    direction: up
    estimated: true
    levels:
      A: "鼓励试错：欢迎新想法，允许走偏再纠"
      B: "接受小偏差：框架内可自主，越界要报批"
      C: "要求既定路径：希望照既定方案执行"
      D: "零容忍：必须严格按指示，自主提议易被视作挑战"

  # ===== 横向协调 =====
  lateral_trust:
    label: "跨部门信任基础"
    direction: lateral
    levels:
      A: "有过节：历史上有矛盾或不愉快"
      B: "陌生：没合作过，互相不了解"
      C: "能配合：有过正常协作，基本靠谱"
      D: "互为后盾：深度互信，互相兜底"

  lateral_interest:
    label: "对方利益诉求了解"
    direction: lateral
    levels:
      A: "完全不知道：不清楚对方部门要什么"
      B: "知道表面：大概了解其职责范围"
      C: "清楚核心KPI：知道对方最关心的指标"
      D: "能预判反应：能预判对方对每个方案的立场"
