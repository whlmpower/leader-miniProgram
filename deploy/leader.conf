# 全向领导力顾问 H5 · Nginx 反向代理 + HTTPS（已填好域名与证书）
# 用法：传到服务器后放到 /etc/nginx/conf.d/leader.conf，再 sudo nginx -t && sudo systemctl reload nginx
# 域名依据证书文件名推断为 w-k-u-m.cn，若实际不是请改下面两处 server_name 与证书文件名。

# HTTP 80：强制跳转到 HTTPS（满足 ICP 备案与 SEO 习惯）
server {
    listen 80;
    server_name w-k-u-m.cn www.w-k-u-m.cn;

    # 阿里云/腾讯云等申请的免费 DV 证书，验证文件通常放这里
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443：对外唯一入口，反向代理到本机 Node
server {
    listen 443 ssl;
    server_name w-k-u-m.cn www.w-k-u-m.cn;

    # 已下载的阿里云 Nginx 版证书（/etc/nginx/ssl/ 下）
    ssl_certificate     /etc/nginx/ssl/w-k-u-m.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/w-k-u-m.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端与接口都由 Node 的 express.static + /api 提供，统一走反代
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 生成报告/模型调用可能较慢，适当放宽
    }

    gzip on;
    gzip_types text/html application/javascript text/css application/json;
}
