# 全向领导力顾问 H5 · Nginx 反向代理 + HTTPS 模板
# 用法：改好 server_name 与证书路径后，放到 /etc/nginx/conf.d/leader.conf 并 reload

# HTTP 80：强制跳转到 HTTPS（满足 ICP 备案与 SEO 习惯）
server {
    listen 80;
    server_name example.com www.example.com;

    # 阿里云/腾讯云等申请的免费 DV 证书，验证文件通常放这里
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443：对外唯一入口，反向代理到本机 Node
server {
    listen 443 ssl;
    server_name example.com www.example.com;

    # ===== 以下两行替换为你自己的证书路径（阿里云控制台下载 Nginx 版）=====
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    # =======================================================================

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态资源 + 报告文件：实际由 Node 的 express.static 提供，这里走反代即可
    # 如想让 Nginx 直出静态（更快），可改为：
    #   location / { proxy_pass http://127.0.0.1:3002; }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 生成报告/模型调用可能较慢，适当放宽
    }

    # 大文件/长连接也可在此做 gzip（前端 JS/HTML 体积小，可选）
    gzip on;
    gzip_types text/html application/javascript text/css application/json;
}
