# ============================================================
# leader-miniProgram · 子路径部署片段（方案 B: /leader/）
# ============================================================
# 用法：把下面两段「粘贴到你现有 w-k-u-m.cn 的 443 ssl server 块内」，
#       放在已有的 `location / { proxy_pass http://127.0.0.1:3001; ... }` 之前或之后均可
#       （Nginx 按最长前缀匹配，`/leader/` 优先于 `/`，互不冲突）。
# 80 server 块无需改动（它已 return 301 https，$host 不变即可）。
# ------------------------------------------------------------

# 1) 访问 /leader（无尾斜杠）时 301 补斜杠。
#    关键：相对路径（assets/...、api/...）依赖「文档 URL 带尾斜杠」才能正确解析，
#    否则浏览器会把相对地址算到根路径，导致资源 404。
location = /leader {
    return 301 https://$host/leader/;
}

# 2) /leader/ 整体反代到本机 3002。
#    注意 proxy_pass 末尾的「/」：它会把 /leader/ 前缀剥离后再转发，
#    即 /leader/api/auth/login  ->  127.0.0.1:3002/api/auth/login
#    因此后端代码（Express 路由仍写在 /api/...）完全不用改。
location /leader/ {
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE / 流式（诊断对话若走流式必须保留）
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    proxy_connect_timeout 10s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;
}

# ============================================================
# 部署后验证（在 ECS 上）：
#   nginx -t && systemctl reload nginx
#   curl -sI https://w-k-u-m.cn/leader/        | head -1   # 期望 200
#   curl -s  https://w-k-u-m.cn/leader/api/config          # 期望返回 {"emailRegister":...}
#   # 浏览器打开 https://w-k-u-m.cn/leader/ 走一遍注册/登录
# ============================================================
